name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09d49-tracewise
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: timeout --signal=TERM --kill-after=60s 20m ./gradlew assembleRelease --no-daemon --console=plain --stacktrace

      - name: Verify standalone APK contains the bundled JavaScript
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" > apk-contents.txt
          grep -Eq '(^|[[:space:]])assets/index\.android\.bundle([[:space:]]|$)' apk-contents.txt
          echo "Verified standalone APK: $apk"
          echo "Verified bundled React Native JavaScript: assets/index.android.bundle"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$apk"
          fi

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracewise-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
